; Steam için masaüstü dışa aktarma ayarları.
; Godot'da Proje → Dışa Aktar menüsünden şablonları indirip "Dışa Aktar"a bas.
; Çıktılar build/ klasörüne gider (git'e girmez). Steam deposu için
; build/windows ve build/linux klasörlerini SteamPipe ile yükle.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/maps/*.json, icon.ico"
exclude_filter="tools/*, tests/*"
export_path="../build/windows/TriviaArena.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
application/icon="res://icon.ico"
application/icon_interpolation=4
application/file_version="0.6.0.0"
application/product_version="0.6.0.0"
application/copyright="© 2026 Trivia Arena"
application/company_name="Trivia Arena"
application/product_name="Trivia Arena: The Grand Stage"
application/file_description="Trivia Arena"

[preset.1]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/maps/*.json, icon.ico"
exclude_filter="tools/*, tests/*"
export_path="../build/linux/TriviaArena.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
